<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Inscrição no Workshop de Desenvolvimento Mobile</title>
</head>

<body>
    <main>
        <h1>Inscrição no Workshop de Desenvolvimento Mobile</h1>
        <p>Preencha o formulário para participar do workshop.</p>

        <form>
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>


            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <label for="age">Idade</label>
            <input type="number" id="age" name="idade" required min="1" max="120">

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <label for="trilha">Trilha de interesse</label>
            <select id="trilha" name="trilha" required>
                <option value="">Selecione uma trilha</option>
                <option value="html-css">HTML e CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="react-native">React Native</option>
            </select>

            <fieldset>
                <legend>Nível de Conhecimento em Programação</legend>
                <label>
                    <input type="radio" name="nivel" value="iniciante" required>
                    Iniciante
                </label>
                <label>
                    <input type="radio" name="nivel" value="intermediario">
                    Intermediário
                </label>
                <label>
                    <input type="radio" name="nivel" value="avancado">
                    Avançado
                </label>

            </fieldset>

            <fieldset>
                <legend>Temas de interesse</legend>
                <label>
                    <input type="checkbox" name="temas" value="interfaces">
                    Criação de interfaces
                </label>
                <label>
                    <input type="checkbox" name="temas" value="componentes">
                    Componentes
                </label>
                <label>
                    <input type="checkbox" name="temas" value="navegacao">
                    Navegação
                </label>
            </fieldset>

            <label for="apresentacao">Apresentação pessoal</label>
            <textarea id="apresentacao" name="apresentacao" rows="5"
                placeholder="Conte um pouco sobre você..."></textarea>

            <button type="submit">Enviar inscrição</button>

        </form>

    </main>
</body>

</html>
